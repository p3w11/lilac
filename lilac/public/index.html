<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lilac — вход</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23b18cff'/><circle cx='50' cy='50' r='14' fill='%234c2f86'/></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="card">
    <div class="logo"><span class="flower"></span> Lilac</div>
    <h1 id="title">С возвращением</h1>
    <p class="sub" id="subtitle">Войди, чтобы написать друзьям</p>

    <div class="tabs">
      <button id="tabLogin" class="active" type="button">Вход</button>
      <button id="tabReg" type="button">Регистрация</button>
    </div>

    <form id="form" autocomplete="on">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" placeholder="например vasya_petrov" required>

      <div id="nameBlock" hidden>
        <label for="displayName">Имя в чате <span style="opacity:.6">(необязательно)</span></label>
        <input id="displayName" name="nickname" autocomplete="nickname" placeholder="Вася" maxlength="32">
      </div>

      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="минимум 6 символов" required>

      <div id="inviteBlock" hidden>
        <label for="inviteCode">Код приглашения</label>
        <input id="inviteCode" name="inviteCode" placeholder="если он указан у друга">
      </div>

      <button class="btn" id="submitBtn" type="submit">Войти</button>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
