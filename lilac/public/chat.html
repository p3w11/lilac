<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lilac — чат</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23b18cff'/><circle cx='50' cy='50' r='14' fill='%234c2f86'/></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="logo"><span class="flower"></span> Lilac</div>
      </div>

      <div class="rooms" id="rooms"></div>

      <div class="online-box">
        <div class="section-title">Сейчас онлайн</div>
        <div id="onlineList"></div>
      </div>

      <div class="me">
        <span class="avatar" id="meAvatar" style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,#b18cff,#8b5cf6)">?</span>
        <span class="grow">
          <b id="meName">—</b>
          <span style="color:var(--muted);font-size:12px" id="meLogin"></span>
        </span>
        <button class="icon-btn" id="profileBtn" type="button">Профиль</button>
        <button class="icon-btn" id="settingsBtn" type="button">Настройки</button>
        <button class="icon-btn" id="logoutBtn" type="button">Выйти</button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <button class="menu-btn" id="menuBtn" type="button">☰</button>
        <div style="flex:1;min-width:0">
          <div class="title" id="roomTitle">Общий чат</div>
          <p class="sub" id="roomSub">Все, кто сейчас в Lilac</p>
        </div>
        <button class="icon-btn" id="newChatBtn" type="button">+ Написать другу</button>
      </header>

      <div class="messages" id="messages"></div>
      <div class="typing" id="typing"></div>

      <form class="composer" id="composer">
        <textarea id="input" placeholder="Сообщение... (Enter — отправить, Shift+Enter — новая строка)" maxlength="2000"></textarea>
        <button class="send" type="submit">Отправить</button>
      </form>
    </main>
  </div>

  <div class="modal-back" id="modal" hidden>
    <div class="modal">
      <h3>Написать другу</h3>
      <input id="peerSearch" placeholder="Поиск по логину" autocomplete="off">
      <div class="modal-list" id="peerList"></div>
      <button class="icon-btn" id="closeModal" type="button" style="margin-top:12px">Закрыть</button>
    </div>
  </div>

  <div class="modal-back" id="profileModal" hidden>
    <div class="modal">
      <h3>Мой профиль</h3>

      <label for="pfName">Отображаемое имя</label>
      <input id="pfName" maxlength="32" placeholder="Как вас видят друзья">
      <div class="hint" id="pfLogin"></div>

      <label for="pfBio">О себе</label>
      <textarea id="pfBio" maxlength="200" rows="3" placeholder="Пара слов о тебе"></textarea>
      <div class="hint"><span id="pfBioCount">0</span>/200</div>

      <label for="pfOld">Текущий пароль</label>
      <input id="pfOld" type="password" autocomplete="current-password" placeholder="Для смены пароля">

      <label for="pfNew">Новый пароль</label>
      <input id="pfNew" type="password" autocomplete="new-password" placeholder="Минимум 6 символов">

      <div class="error" id="pfError"></div>
      <div class="row-btns">
        <button class="icon-btn" id="pfCancel" type="button">Отмена</button>
        <button class="btn" id="pfSave" type="button" style="margin:0;width:auto;padding:10px 22px">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="modal-back" id="settingsModal" hidden>
    <div class="modal modal-wide">
      <h3>Настройки приватности</h3>
      <p class="hint" style="margin:0 0 6px">
        «Только контакты» — значит те, с кем у тебя уже есть личная переписка.
      </p>
      <div id="settingsList"></div>
      <div class="error" id="stError"></div>
      <div class="row-btns">
        <button class="icon-btn" id="stCancel" type="button">Отмена</button>
        <button class="btn" id="stSave" type="button" style="margin:0;width:auto;padding:10px 22px">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="modal-back" id="peerModal" hidden>
    <div class="modal">
      <h3 id="pmName">Профиль</h3>
      <div class="hint" id="pmLogin"></div>
      <div id="pmBody"></div>
      <div class="row-btns">
        <button class="icon-btn" id="pmClose" type="button">Закрыть</button>
        <button class="btn" id="pmWrite" type="button" style="margin:0;width:auto;padding:10px 22px">Написать</button>
      </div>
    </div>
  </div>

  <script src="/js/chat.js"></script>
</body>
</html>
